<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sabremetrics</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="home-link" href="index.html">← Home</a>
    <span>02 / 04</span>
  </header>
  <main class="content-shell">
    <div class="page-heading">
      <div>
        <h1>Sabremetrics</h1>
      </div>
      <p id="last-updated" class="updated-pill">Last updated: loading…</p>
    </div>
    <div class="table-frame">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Wins</th>
              <th>Losses</th>
              <th>Pushes</th>
              <th>Winning %</th>
              <th>Units +/-</th>
            </tr>
          </thead>
          <tbody id="stats-body">
            <tr><td colspan="6">Loading standings…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="site-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
